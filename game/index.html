<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an original open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0c0e12;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #4d7a3f;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p id="status" class="visually-hidden" aria-live="polite">Solmar Bay loading</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
